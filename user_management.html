<!DOCTYPE html>
<html>
<head>
    <title>User Management | CrowdCount</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>

<div class="container">

<!-- SIDEBAR -->
<div class="sidebar">
    <h2>CrowdCount</h2>
    <ul>
        <li onclick="go('admin_dashboard.html')">🏠 Dashboard</li>
        <li onclick="go('analytics.html')">📊 Analytics</li>
        <li onclick="go('cameras.html')">📷 Cameras</li>
        <li onclick="go('zones.html')">🗺 Zones</li>
        <li onclick="go('export.html')">📤 Export Data</li>
        <li onclick="go('settings.html')">⚙ Settings</li>
        <li onclick="go('user_management.html')">👥 User Management</li>
        <li onclick="logout()">🚪 Logout</li>
    </ul>
</div>

<!-- MAIN -->
<div class="main">
<h1>User Management</h1>
<p>Manage system users and access levels</p>

<table border="1" width="100%" cellpadding="10">
    <thead>
        <tr>
            <th>User</th>
            <th>Role</th>
            <th>Status</th>
            <th>Last Login</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody id="userTable">
        <!-- Loaded dynamically -->
    </tbody>
</table>

</div>
</div>

<script>
(function protect(){
    const token = localStorage.getItem("token");
    const role = localStorage.getItem("role");
    if(!token || role !== "admin"){
        window.location.href = "login.html";
    }
})();

function go(p){ location.href = p }
function logout(){ localStorage.clear(); go("login.html") }


function loadUsers(){
    fetch("http://127.0.0.1:5000/users")
    .then(res => res.json())
    .then(users => {
        const tbody = document.getElementById("userTable");
        tbody.innerHTML = "";

        users.forEach(u => {
            const disableBtn = `
                <button onclick="toggleUser('${u.username}')">
                    ${u.status === "Active" ? "Disable" : "Enable"}
                </button>`;

            const deleteBtn = u.role === "admin"
                ? "<span style='color:gray'>Protected</span>"
                : `<button style="color:red"
                        onclick="deleteUser('${u.username}')">
                        Delete
                   </button>`;

            tbody.innerHTML += `
            <tr>
                <td>${u.username}</td>
                <td>
                    <select onchange="changeRole('${u.username}', this.value)">
                        <option value="admin" ${u.role==="admin"?"selected":""}>Admin</option>
                        <option value="user" ${u.role==="user"?"selected":""}>User</option>
                    </select>
                </td>
                <td>${u.status}</td>
                <td>${u.last_login || "-"}</td>
                <td>
                    ${disableBtn}
                    ${deleteBtn}
                </td>
            </tr>`;
        });
    });
}

function toggleUser(username){
    fetch(`http://127.0.0.1:5000/users/toggle/${username}`, {
        method: "POST"
    }).then(() => loadUsers());
}

function changeRole(username, role){
    fetch("http://127.0.0.1:5000/users/role", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ username, role })
    }).then(() => loadUsers());
}

function deleteUser(username){
    if(!confirm(`Delete user "${username}" permanently?`)) return;

    fetch(`http://127.0.0.1:5000/users/delete/${username}`, {
        method: "DELETE"
    }).then(() => loadUsers());
}

loadUsers();


</script>


</body>
</html>
